name: Issue Triage Checks

# Validates the /triage agentic workflow (issue-triage.md), its eval workflow
# (issue-triage-eval.md), the shared skill, and the deterministic helpers
# (tools/ci/issue_triage*.cjs). Deterministic only: no model calls, no secrets.
#   * helper-tests  -- node:test suites for the triage helper and eval harness,
#                      plus validate-fixtures, which checks every eval case and
#                      its evidence anchors against the pinned commits.
#   * compile-drift -- recompiles both workflows with the pinned gh-aw version
#                      and fails if a committed .lock.yml differs.
#                      Uses only the read-only GITHUB_TOKEN to download gh-aw.
#
# See docs/ci/issue-triage.md.

on:
  pull_request:
    paths:
      - 'tools/ci/issue_triage*'
      - 'tools/ci/tests/issue_triage*'
      - '.github/workflows/issue-triage*'
      - '.github/skills/issue-triage/**'
      - 'tests/evals/issue-triage/**'
      - '.github/aw/**'
  push:
    branches: [main]
    paths:
      - 'tools/ci/issue_triage*'
      - 'tools/ci/tests/issue_triage*'
      - '.github/workflows/issue-triage*'
      - '.github/skills/issue-triage/**'
      - 'tests/evals/issue-triage/**'
      - '.github/aw/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-triage-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          # Eval cases pin older commits; validate-fixtures reads files at those SHAs.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run helper tests
        run: node --test tools/ci/tests/issue_triage.test.cjs tools/ci/tests/issue_triage_eval.test.cjs
      - name: Validate eval fixtures
        run: node tools/ci/issue_triage_eval.cjs validate-fixtures

  compile-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep in sync with the gh-aw version recorded in issue-triage.lock.yml.
      GH_AW_VERSION: v0.89.21
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin "$GH_AW_VERSION"
      - name: Recompile and check for drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile issue-triage --strict
          gh aw compile issue-triage-eval --strict
          if ! git diff --exit-code -- .github/workflows/issue-triage.lock.yml .github/workflows/issue-triage-eval.lock.yml .github/aw/; then
            echo "::error::A triage .lock.yml is out of date. Run 'gh aw compile issue-triage --strict' and 'gh aw compile issue-triage-eval --strict' with gh-aw $GH_AW_VERSION and commit the result."
            exit 1
          fi
